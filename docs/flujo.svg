<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1180" viewBox="0 0 2000 1180" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif"><title id="t">OMNI Logistics · de la cámara del almacén a la operación</title><desc id="d">Cuatro modelos, cada uno con su trabajo, cargados solo cuando hacen falta. Las cifras de velocidad están medidas en esta máquina; las de acierto vienen de la validación de cada uno.</desc><defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.14"/></filter><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L8,4.5 z" fill="#334155"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/><text x="48" y="52" font-size="30" font-weight="700" fill="#0f172a" text-anchor="start">OMNI Logistics · de la cámara del almacén a la operación</text><text x="48" y="82" font-size="14" font-weight="400" fill="#475569" text-anchor="start">Cuatro modelos, cada uno con su trabajo, cargados solo cuando hacen falta. Las cifras de velocidad están medidas en</text><text x="48" y="102" font-size="14" font-weight="400" fill="#475569" text-anchor="start">esta máquina; las de acierto vienen de la validación de cada uno.</text><rect x="60" y="150" width="360" height="900" rx="18" fill="#e2e8f0" fill-opacity="0.5" stroke="#94a3b8" stroke-width="1.5"/><text x="76" y="178" font-size="13" font-weight="700" fill="#334155" text-anchor="start">ENTRADA</text><text x="76" y="196" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start">Las cámaras que ya hay</text><rect x="460" y="150" width="360" height="900" rx="18" fill="#dbeafe" fill-opacity="0.5" stroke="#94a3b8" stroke-width="1.5"/><text x="476" y="178" font-size="13" font-weight="700" fill="#334155" text-anchor="start">DETECCIÓN</text><text x="476" y="196" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start">Cuatro modelos, uno por trabajo</text><rect x="860" y="150" width="340" height="900" rx="18" fill="#ede9fe" fill-opacity="0.5" stroke="#94a3b8" stroke-width="1.5"/><text x="876" y="178" font-size="13" font-weight="700" fill="#334155" text-anchor="start">IDENTIDAD</text><text x="876" y="196" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start">Qué es el mismo objeto</text><rect x="1240" y="150" width="340" height="900" rx="18" fill="#dcfce7" fill-opacity="0.5" stroke="#94a3b8" stroke-width="1.5"/><text x="1256" y="178" font-size="13" font-weight="700" fill="#334155" text-anchor="start">ANALÍTICA</text><text x="1256" y="196" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start">Qué significa para la operación</text><rect x="1620" y="150" width="320" height="900" rx="18" fill="#fef3c7" fill-opacity="0.5" stroke="#94a3b8" stroke-width="1.5"/><text x="1636" y="178" font-size="13" font-weight="700" fill="#334155" text-anchor="start">DECISIÓN</text><text x="1636" y="196" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start">Qué se hace con eso</text><path d="M 400 330 H 440.0 V 330 H 480" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/><text x="440.0" y="320" font-size="11" font-weight="600" fill="#334155" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke">fotogramas</text><path d="M 400 700 V 1010 H 1390 V 960" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/><text x="830.0" y="1002" font-size="11.5" font-weight="600" fill="#334155" text-anchor="middle">las zonas entran en la analítica, no en el detector</text><path d="M 800 330 H 840.0 V 400 H 880" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/><text x="840.0" y="320" font-size="11" font-weight="600" fill="#334155" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke">cajas</text><path d="M 800 660 H 1030.0 V 880 H 1260" fill="none" stroke="#334155" stroke-width="2.2" stroke-dasharray="8 7" marker-end="url(#arrow)"/><text x="1030.0" y="650" font-size="11" font-weight="600" fill="#334155" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke">sin seguimiento</text><path d="M 1180 400 H 1220.0 V 400 H 1260" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/><text x="1220.0" y="390" font-size="11" font-weight="600" fill="#334155" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke">ID estable</text><path d="M 1560 400 H 1600.0 V 330 H 1640" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M 1560 700 H 1600.0 V 560 H 1640" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M 1560 880 H 1600.0 V 790 H 1640" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="80" y="250" width="320" height="175" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><rect x="96" y="262" width="69.6" height="20" rx="10" fill="#e2e8f0"/><text x="130.8" y="276" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">EXISTENTE</text><text x="96" y="304" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Cámara de almacén o muelle</text><text x="96" y="329" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Un .mp4 de la cámara de siempre.</text><text x="96" y="345" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Los videos van por módulo, y el</text><text x="96" y="361" font-size="11" font-weight="400" fill="#475569" text-anchor="start">listado filtra según el elegido.</text><rect x="80" y="560" width="320" height="190" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><rect x="96" y="572" width="56.800000000000004" height="20" rx="10" fill="#dbeafe"/><text x="124.4" y="586" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">UNA VEZ</text><text x="96" y="614" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Zonas, pasillos y línea</text><text x="96" y="639" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Un polígono por zona, otro por</text><text x="96" y="655" font-size="11" font-weight="400" fill="#475569" text-anchor="start">ruta de evacuación, y una línea</text><text x="96" y="671" font-size="11" font-weight="400" fill="#475569" text-anchor="start">en el muelle. Guardados de 0 a 1</text><text x="96" y="687" font-size="11" font-weight="400" fill="#475569" text-anchor="start">por video.</text><rect x="480" y="230" width="320" height="250" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><rect x="496" y="242" width="63.2" height="20" rx="10" fill="#dcfce7"/><text x="527.6" y="256" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">DETECTOR</text><text x="496" y="284" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">pallet_n_640 · pallets</text><text x="496" y="309" font-size="11" font-weight="400" fill="#475569" text-anchor="start">YOLO11n afinado con pallets de</text><text x="496" y="325" font-size="11" font-weight="400" fill="#475569" text-anchor="start">madera. Es el que sostiene la</text><text x="496" y="341" font-size="11" font-weight="400" fill="#475569" text-anchor="start">cifra de ocupación.</text><line x1="496" y1="349" x2="784" y2="349" stroke="#e2e8f0" stroke-width="1.5"/><text x="496" y="365" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">mAP@50</text><text x="784" y="365" font-size="12" font-weight="700" fill="#166534" text-anchor="end">67.4 %</text><text x="496" y="384" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">mAP@50-95</text><text x="784" y="384" font-size="12" font-weight="700" fill="#166534" text-anchor="end">57.1 %</text><text x="496" y="403" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">velocidad medida</text><text x="784" y="403" font-size="12" font-weight="700" fill="#1e40af" text-anchor="end">57.7 fps</text><text x="496" y="422" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">latencia</text><text x="784" y="422" font-size="12" font-weight="700" fill="#1e40af" text-anchor="end">17.3 ms</text><rect x="480" y="580" width="320" height="250" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><rect x="496" y="592" width="76.0" height="20" rx="10" fill="#fee2e2"/><text x="534.0" y="606" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">CON FILTRO</text><text x="496" y="634" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">fire_smoke + brillo</text><text x="496" y="659" font-size="11" font-weight="400" fill="#475569" text-anchor="start">El detector solo marca cada</text><text x="496" y="675" font-size="11" font-weight="400" fill="#475569" text-anchor="start">reflejo de foco como incendio.</text><text x="496" y="691" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Se exige además brillo alto</text><text x="496" y="707" font-size="11" font-weight="400" fill="#475569" text-anchor="start">dentro de la caja.</text><line x1="496" y1="715" x2="784" y2="715" stroke="#e2e8f0" stroke-width="1.5"/><text x="496" y="731" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">mAP@50</text><text x="784" y="731" font-size="12" font-weight="700" fill="#166534" text-anchor="end">76.5 %</text><text x="496" y="750" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">velocidad medida</text><text x="784" y="750" font-size="12" font-weight="700" fill="#1e40af" text-anchor="end">65.6 fps</text><text x="496" y="769" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">sin el filtro</text><text x="784" y="769" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="end">suena todo el día</text><rect x="880" y="300" width="300" height="250" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><rect x="896" y="312" width="82.4" height="20" rx="10" fill="#ede9fe"/><text x="937.2" y="326" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">SEGUIMIENTO</text><text x="896" y="354" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">ByteTrack</text><text x="896" y="379" font-size="11" font-weight="400" fill="#475569" text-anchor="start">El mismo ID entre fotogramas,</text><text x="896" y="395" font-size="11" font-weight="400" fill="#475569" text-anchor="start">para pallets y montacargas.</text><text x="896" y="411" font-size="11" font-weight="400" fill="#475569" text-anchor="start"></text><text x="896" y="427" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Los cuatro modelos se cargan</text><text x="896" y="443" font-size="11" font-weight="400" fill="#475569" text-anchor="start">solo al usarse: cargarlos todos</text><text x="896" y="459" font-size="11" font-weight="400" fill="#475569" text-anchor="start">de golpe tarda y ocupa memoria.</text><line x1="896" y1="467" x2="1164" y2="467" stroke="#e2e8f0" stroke-width="1.5"/><text x="896" y="483" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">si falta un peso</text><text x="1164" y="483" font-size="12" font-weight="700" fill="#92400e" text-anchor="end">el módulo sale apagado</text><text x="896" y="502" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">no</text><text x="1164" y="502" font-size="12" font-weight="700" fill="#166534" text-anchor="end">revienta a media faena</text><rect x="1260" y="300" width="300" height="165" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="1276" y="326" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Ocupación por zona</text><text x="1276" y="351" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Cuántos pallets dentro de cada</text><text x="1276" y="367" font-size="11" font-weight="400" fill="#475569" text-anchor="start">polígono, y desde cuándo.</text><line x1="1276" y1="375" x2="1544" y2="375" stroke="#e2e8f0" stroke-width="1.5"/><text x="1276" y="391" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">hoy se sabe</text><text x="1544" y="391" font-size="12" font-weight="700" fill="#92400e" text-anchor="end">de ayer, si alguien apuntó</text><rect x="1260" y="610" width="300" height="165" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="1276" y="636" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Muelle: piezas por minuto</text><text x="1276" y="661" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Cruces de línea de pallets y</text><text x="1276" y="677" font-size="11" font-weight="400" fill="#475569" text-anchor="start">montacargas.</text><line x1="1276" y1="685" x2="1544" y2="685" stroke="#e2e8f0" stroke-width="1.5"/><text x="1276" y="701" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">es</text><text x="1544" y="701" font-size="12" font-weight="700" fill="#166534" text-anchor="end">el tiempo real de descarga</text><rect x="1260" y="790" width="300" height="165" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="1276" y="816" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Caída · velocidad · obstrucción</text><text x="1276" y="841" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Cada uno dispara UNA vez. Cuatro</text><text x="1276" y="857" font-size="11" font-weight="400" fill="#475569" text-anchor="start">segundos en el suelo son una</text><text x="1276" y="873" font-size="11" font-weight="400" fill="#475569" text-anchor="start">caída, no cien alarmas.</text><line x1="1276" y1="881" x2="1544" y2="881" stroke="#e2e8f0" stroke-width="1.5"/><text x="1276" y="897" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">fijado por</text><text x="1544" y="897" font-size="12" font-weight="700" fill="#166534" text-anchor="end">test_eventos.py</text><rect x="1640" y="250" width="280" height="175" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><rect x="1656" y="262" width="44.0" height="20" rx="10" fill="#dcfce7"/><text x="1678.0" y="276" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">VALOR</text><text x="1656" y="304" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Cuánto queda libre ahora</text><text x="1656" y="329" font-size="11" font-weight="400" fill="#475569" text-anchor="start">No cuánto quedaba ayer cuando</text><text x="1656" y="345" font-size="11" font-weight="400" fill="#475569" text-anchor="start">alguien pasó a apuntarlo.</text><rect x="1640" y="480" width="280" height="175" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><rect x="1656" y="492" width="44.0" height="20" rx="10" fill="#dcfce7"/><text x="1678.0" y="506" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">VALOR</text><text x="1656" y="534" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Cuánto tarda de verdad</text><text x="1656" y="559" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Una descarga, con datos y no</text><text x="1656" y="575" font-size="11" font-weight="400" fill="#475569" text-anchor="start">con la impresión del turno.</text><rect x="1640" y="710" width="280" height="175" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><rect x="1656" y="722" width="44.0" height="20" rx="10" fill="#dcfce7"/><text x="1678.0" y="736" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">VALOR</text><text x="1656" y="764" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Aviso antes del humo</text><text x="1656" y="789" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Y un pasillo de evacuación que</text><text x="1656" y="805" font-size="11" font-weight="400" fill="#475569" text-anchor="start">no lleva diez minutos tapado.</text><rect x="48" y="1090" width="1904" height="52" rx="12" fill="#e2e8f0"/><text x="70" y="1122" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="start">Un detector de fuego a secas marca como incendio cada foco del almacén. La comprobación de brillo es la diferencia entre una alarma que se atiende y una que en una semana nadie mira.</text></svg>